name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pipeline pengujian memakai database test (file:./test-whatsapp.db),
# bukan database development. Nilai ini ditimpa/ dipakai ulang oleh
# scripts/prepare-test-db.mjs dan tests/test-env.ts.
env:
  DATABASE_URL: file:./test-whatsapp.db

jobs:
  verify:
    name: Lint, TypeScript, Unit Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      # scripts/run-tests.mjs menjalankan scripts/prepare-test-db.mjs
      # sebelum setiap suite, sehingga seluruh pengujian terisolasi pada
      # prisma/test-whatsapp.db (7 suite, termasuk rbac-api.test.ts).
      - name: Unit & regression tests
        run: npm run test

      - name: Production build
        run: npm run build
